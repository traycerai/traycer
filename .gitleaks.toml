# Gitleaks configuration — Traycer open-source repo.
#
# Extends the upstream default ruleset and suppresses known-safe false
# positives. Every entry here is a PUBLIC test fixture, never a real
# credential. Keep this list tight and document why each item is safe.

title = "Traycer gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Stable scrollStateKey identifiers in the original and split chat-messages unit suites. These exact strings are cache-key test IDs, not credentials; require both the precise source path and value."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^clients/gui-app/src/components/chat/__tests__/chat-messages(?:-(?:anchor-engine|core|library-contract|navigation|persistence))?\.test\.tsx?$''',
]
regexes = [
  '''^(?:h3-gesture-preempts-ownership|m3b-usable-hit-strip|s4b-reachability-key|t4-optimistic-anchor-key|t4-anchor-drift-key|t4-gated-follow-key|t11-e-strict-epsilon-2|t10-nav-abort-gesture|t12-anchor-drift|t12-follow-catchup|t18-pin-c-exhaust|t19-hydration-nav-key|t22-pin3-no-double-correction|t22-below-anchor-no-repair|t22-unmount-mid-repair|t22-shrink-above-anchor)$''',
]

[[allowlists]]
description = "Historical message-list license unit-test fixture. Its payload identifies it as a public test key, not a production credential; require both the exact source path and value."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^clients/gui-app/src/components/chat/__tests__/chat-messages\.test\.tsx$''',
]
regexes = [
  '''^eff2c8c42294f62b09cebd99d82c8c93b25URVNUO2V4OTk5OTk5OTk5OTk5OQ==$''',
]

[[allowlists]]
description = "Minisign PUBLIC verification key fixture in the desktop download-resilience tests (v1.1.7 update-flow work). Decodes to exactly 42 bytes: 'Ed' algorithm tag + key id 847ef539119a1961 (matching the adjacent HOST_SIGNING_KEY_ID constant) + 32-byte public key. A verification key is public by design, never a credential. Scoped to the exact string and source path."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^clients/desktop/src/electron-main/cli/__tests__/cross-layer-download-resilience\.test\.ts$''',
]
regexes = [
  '''^RWSEfvU5EZoZYQTQUOVHeQFv3poThl1VM7FZLkNQr0Zu0FyL2x\+u2O2l$''',
]

[[allowlists]]
description = "Chat transcript scroll-state cache keys in the original and split gui-app chat tests - kebab-case UI state bucket names (e.g. a per-test anchor key) that the generic-api-key rule matches only because the field is literally named `scrollStateKey`. These are UI state keys, never credentials. Path-scoped to the monolith and its five split files; `fetch-depth: 0` means the PR scan sees them on in-flight branches before they merge, so this cannot wait for the introducing branch to land."
condition = "AND"
regexTarget = "line"
paths = [
  '''^clients/gui-app/src/components/chat/__tests__/chat-messages(?:-(?:anchor-engine|core|library-contract|navigation|persistence))?\.test\.tsx?$''',
]
regexes = [
  '''scrollStateKey: "[A-Za-z0-9_-]+"''',
]

[[allowlists]]
description = "RFC 6455's public sample client nonce in the historic loopback handshake probe. Require both the exact nonce and its source path so unrelated findings remain reportable."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^clients/desktop/src/electron-main/host/host-lifecycle\.ts$''',
]
regexes = [
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
]

[[allowlists]]
description = "JWT-shaped scrubber fixture. This exact dummy value verifies redaction of JWTs in user text and logs; require both its precise test path and full value."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^clients/desktop/src/electron-main/app/__tests__/support-scrubber\.test\.ts$''',
]
regexes = [
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9[.]eyJzdWIiOiIxMjM0NTY3ODkwIn0[.]dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U$''',
]

[[allowlists]]
description = "Base64 non-UTF-8 path fixtures in the split PR-diff find/body suites. Both values decode to literal filename BYTES - `YmFkLf8udHh0` is `bad-\\xff.txt` and `YmFkLf4udHh0` is `bad-\\xfe.txt` - fed to the `pathBytes` wire field to prove byte-exact round-tripping of paths that are not valid UTF-8. The generic-api-key rule matches them only on base64 shape and entropy; neither is a credential. Same situation as the chat-messages scrollStateKey entry above: `fetch-depth: 0` makes the PR scan see these on the in-flight branch that introduces them (`traycer/non-utf8-path-bytes`), so every unrelated PR fails until this lands - it cannot wait for that branch to merge. Scoped to both exact values and both source paths so unrelated findings stay reportable."
condition = "AND"
regexTarget = "secret"
paths = [
  '''^clients/gui-app/src/components/epic-canvas/renderers/__tests__/pr-diff-tile-find\.test\.tsx$''',
  '''^clients/gui-app/src/components/epic-canvas/pr/__tests__/pr-local-diff-body\.test\.tsx$''',
]
regexes = [
  '''^YmFkLf(?:8|4)udHh0$''',
]
