<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word preview browser regression</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #f5f5f5;
        color: #171717;
        font-family: Arial, sans-serif;
      }

      #fixtures {
        display: flex;
        gap: 16px;
        width: 100%;
        height: 100%;
        padding: 16px;
        box-sizing: border-box;
      }

      [data-word-tile] {
        display: flex;
        flex: 0 0 auto;
        width: 600px;
        height: 100%;
        min-width: 0;
        overflow: hidden;
        border: 1px solid #d4d4d4;
        background: #fff;
      }

      [data-word-tile] > div {
        min-width: 0;
      }

      #test-state {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./docx-preview-browser-regression.tsx"></script>
  </body>
</html>
