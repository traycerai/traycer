<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating surface motion regression</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #root {
        position: relative;
      }
      .probe-floating,
      [data-profile-usage-sidecar],
      .tc-editor-bubble-menu {
        box-sizing: border-box;
        width: 120px;
        height: 40px;
      }
      .probe-floating {
        position: fixed;
        top: 0;
        left: 0;
      }
      [data-profile-usage-sidecar],
      .tc-editor-bubble-menu {
        position: fixed;
        top: 0;
        left: 0;
      }
      .probe-popover-anchor,
      .probe-quote-anchor {
        position: fixed;
        left: 120px;
        top: 240px;
      }
      .probe-popover-anchor {
        width: 100px;
        height: 24px;
      }
      .probe-quote-anchor {
        font: 16px/24px sans-serif;
        white-space: nowrap;
      }
      .probe-motion-surface {
        position: fixed;
        left: 0;
        top: 0;
        width: 40px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./panel-motion-position.tsx"></script>
  </body>
</html>
