# Field ids on this template are not yet targeted by
# clients/shared/support/issue-reporter.ts, but "idea" reports will route
# here by id once the app's type-chip routing ships (ticket 07). Treat ids
# and `required` flags as frozen for the same reason as bug_report.yml - see
# clients/shared/support/__tests__/issue-template-contract.test.ts.
name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's getting in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI
        - Desktop app
        - Protocol
        - Other / not sure
    validations:
      required: true
