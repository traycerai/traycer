name: Early B v2 M33 diagnostic
run-name: Early B v2 M33 diagnostic · exact 813ee7e2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  named-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: direct
            files: src/components/settings/panels/__tests__/host-overview-settings-card-slot.test.tsx
            selector: keeps the Overview card and its open Stop sheet after a failed
            expected: 2
          - group: class
            files: src/components/settings/panels/__tests__/host-overview-settings-card-slot.test.tsx
            selector: failed pooled binding reread|first pooled binding arrives|failed role reread|without binding support
            expected: 4
          - group: authority
            files: src/components/settings/panels/__tests__/host-overview-settings-card-slot.test.tsx src/components/settings/details/__tests__/details-drawer.test.tsx
            selector: withdraws the Details Team subject|closes an open Claim|withdraws the cached Team row|selects Status when a Details subject disappears
            expected: 5
          - group: outage
            files: src/components/settings/panels/__tests__/host-overview-settings-card-slot.test.tsx src/components/settings/details/__tests__/details-drawer.test.tsx
            selector: does not restore a refused Team subject|preserves open Claim when the directory|preserves the stopped Move.s Export request
            expected: 3
          - group: wrapped-refusal
            files: src/lib/__tests__/query-client.test.ts
            selector: without retrying a wrapped membership refusal
            expected: 2
          - group: bot-refusal
            files: src/lib/bots/__tests__/bot-read-readability.test.ts src/lib/bots/__tests__/bot-read-view.test.ts
            selector: withdraws retained bot rows|offers Check again when remote readiness
            expected: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7f51c1f4a3358ea1a15a3edef8c1a10e640d533f
          persist-credentials: false
      - name: Verify the qualified checkout
        run: |
          test "$(git rev-parse HEAD)" = 7f51c1f4a3358ea1a15a3edef8c1a10e640d533f
          test "$(git rev-parse 'HEAD^{tree}')" = 813ee7e27b8af06e38de39751e99adb4a47ac51e
      - uses: ./.github/actions/bootstrap-ci-tools
        with:
          mirror-base-url: ${{ vars.CI_TOOLS_MIRROR_BASE_URL }}
          bun-version: "1.4.4"
          tools: node bun electron
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun run --cwd clients/desktop install-electron
      - name: Run the authorized M33 selector once
        id: named
        continue-on-error: true
        working-directory: clients/gui-app
        env:
          CASE_FILES: ${{ matrix.files }}
          SELECTOR: ${{ matrix.selector }}
        run: |
          read -r -a files <<< "$CASE_FILES"
          bun run vitest run "${files[@]}" -t "$SELECTOR" --retry=0             --reporter=junit --outputFile.junit="$RUNNER_TEMP/m33-raw.xml"
      - name: Retain case outcomes and failure frames
        if: always()
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "m33-raw.xml"
          cases = []
          if source.exists():
              for case in ET.parse(source).iter("testcase"):
                  if case.find("skipped") is not None:
                      continue
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  row = {"title": case.get("name"), "file": case.get("classname"), "outcome": "pass"}
                  if failure is not None:
                      diagnostic = failure.get("message", "") + "\n" + (failure.text or "")
                      frame = re.search(r"[\w./-]+\.test\.tsx?:\d+:\d+", diagnostic)
                      row.update(outcome="fail", error_class=failure.get("type"), frame=frame[0] if frame else None)
                  cases.append(row)
          payload = json.dumps(cases)
          (root / "m33-result.json").write_text(payload)
          print("m33-result " + payload)
          if len(cases) != int(os.environ["EXPECTED"]):
              raise SystemExit(1)
          RECEIPT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: early-b-m33-${{ matrix.group }}
          path: ${{ runner.temp }}/m33-result.json
          if-no-files-found: error
      - name: Preserve the first attempt outcome
        if: always()
        run: test "${{ steps.named.outcome }}" = success
