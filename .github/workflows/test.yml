name: M33 Stop sheet red witness
run-name: M33 Stop sheet red · exact 2974087b
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  named-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 087352e2c5913e71ed11e478aa69a1d4523b4e2e
          persist-credentials: false
      - name: Verify the qualified checkout
        run: |
          test "$(git rev-parse HEAD)" = 087352e2c5913e71ed11e478aa69a1d4523b4e2e
          test "$(git rev-parse 'HEAD^{tree}')" = 2974087bf8e30c4ba2273ebfdf3056e6adf58cbf
      - uses: ./.github/actions/bootstrap-ci-tools
        with:
          mirror-base-url: ${{ vars.CI_TOOLS_MIRROR_BASE_URL }}
          bun-version: "1.4.4"
          tools: node bun electron
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun run --cwd clients/desktop install-electron
      - name: Run the two named Stop sheet cases once
        id: named
        continue-on-error: true
        working-directory: clients/gui-app
        run: |
          bunx vitest run src/components/settings/panels/__tests__/host-overview-settings-card-slot.test.tsx \
            -t 'keeps the Overview card and its open Stop sheet' --retry=0 \
            --reporter=junit --outputFile.junit="$RUNNER_TEMP/m33-raw.xml"
      - name: Retain sanitized per-case JUnit
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          import xml.etree.ElementTree as ET
          dest = Path(os.environ["RUNNER_TEMP"])
          raw = dest / "m33-raw.xml"
          suite = ET.Element("testsuite", name="M33 Stop sheet red")
          if raw.exists():
              for case in ET.parse(raw).iter("testcase"):
                  name = case.get("name", "")
                  if "keeps the Overview card and its open Stop sheet" not in name:
                      continue
                  out = ET.SubElement(suite, "testcase", name=name, time=case.get("time", "0"))
                  for element in case:
                      if element.tag not in ("failure", "error", "skipped"):
                          continue
                      body = (element.get("message", "") or "") + "\n" + (element.text or "")
                      frame = re.search(r"host-overview-settings-card-slot\.test\.tsx:\d+:\d+", body)
                      missing = bool(re.search(r"Unable to find an element by:.*stop-sharing-sheet", body))
                      status = {"failure": "Assertion failed", "error": "Case error", "skipped": "Case skipped"}[element.tag]
                      if missing:
                          status = "Missing stop-sharing-sheet"
                      child = ET.SubElement(out, element.tag, message=status)
                      child.text = frame[0] if frame else ""
                  print("M33 case", name, next((part.get("message") for part in out), "PASS"))
          suite.set("tests", str(len(suite)))
          ET.ElementTree(suite).write(dest / "m33-named-junit.xml", encoding="utf-8", xml_declaration=True)
          if len(suite) != 2:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: m33-named-junit
          path: ${{ runner.temp }}/m33-named-junit.xml
          if-no-files-found: error
      - name: Preserve first-attempt test outcome
        if: always()
        run: test "${{ steps.named.outcome }}" = success
