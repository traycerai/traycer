name: Tests

# Tests run as their own workflow so they start in parallel with the static
# checks (build/typecheck/lint/format). Each nx test project runs as its own
# matrix job, so total wall-clock is the slowest single project rather than the
# sum of all three. No secrets.

on:
  pull_request:
  push:
    branches: [main]
  # A manual trigger for a sparing branch run, when a check is actually
  # needed before the merge (AGENTS.md, "When CI runs").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a pull request's runs supersede each other. A push to `main` gets its own
  # group (the run id): every merge is tested once, so a later merge must never
  # cancel an earlier merge's run.
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    # Every leg runs on the standard runner. This repository is public, and
    # standard runners are free and unmetered on public repositories; larger
    # runners (`ubuntu-latest-8-cores`) are billed even here. The GUI shards
    # were the ONLY paid jobs in this repository: 122k 8-core minutes in
    # August 2026, $2,690, for a suite whose vitest config caps itself at two
    # fork workers (`MAX_TEST_WORKERS` in clients/gui-app/vitest.config.ts) —
    # so the extra cores were never used. Public-repo standard runners are
    # 4 vCPU / 16 GB, which covers two forks plus the parent comfortably.
    runs-on: ubuntu-24.04
    # The GUI suite deliberately runs isolated two-worker forks: disabling
    # isolation makes tests leak state. Twenty deterministic Vitest shards run
    # as parallel matrix jobs; the twelve-shard bodies measured 2m20–4m20 on
    # the 8-core runner, so the narrower units hold wall-clock on the smaller
    # runner. Shards are free here, so more of them costs only queue slots.
    strategy:
      # Run every project even if one fails, so a single red project doesn't
      # mask the others.
      fail-fast: false
      matrix:
        # The nx projects that own a `test` target. Names are exact nx project
        # names (gui-app's differs from its package scope). Keep in sync with
        # `nx show projects --with-target test`.
        include:
          - project: "@traycer/protocol"
            name: "test (@traycer/protocol)"
            # Naming a reporter replaces vitest's defaults on CI, so the two it
            # would have chosen stay named. The report is what the budget step
            # below reads, and the target's `outputs` restore it on a cache hit.
            test_args: "-- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-results/junit.xml"
            cache_key: "@traycer/protocol"
          - project: "@traycer/html-source"
            name: "test (@traycer/html-source)"
            test_args: ""
            cache_key: "@traycer/html-source"
          # `test (traycer-clients-gui-app)` is the one gui-app context the
          # `main` ruleset requires, so shard 1 keeps that name. The other
          # shards carry no ruleset name of their own; the historical
          # "shard N", "shard N of 8" and "shard N of 12" labels were kept only
          # for that reason and are retired here in favour of one scheme.
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app)"
            test_args: "-- --shard=1/20"
            cache_key: "traycer-clients-gui-app-1-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 2 of 20)"
            test_args: "-- --shard=2/20"
            cache_key: "traycer-clients-gui-app-2-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 3 of 20)"
            test_args: "-- --shard=3/20"
            cache_key: "traycer-clients-gui-app-3-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 4 of 20)"
            test_args: "-- --shard=4/20"
            cache_key: "traycer-clients-gui-app-4-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 5 of 20)"
            test_args: "-- --shard=5/20"
            cache_key: "traycer-clients-gui-app-5-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 6 of 20)"
            test_args: "-- --shard=6/20"
            cache_key: "traycer-clients-gui-app-6-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 7 of 20)"
            test_args: "-- --shard=7/20"
            cache_key: "traycer-clients-gui-app-7-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 8 of 20)"
            test_args: "-- --shard=8/20"
            cache_key: "traycer-clients-gui-app-8-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 9 of 20)"
            test_args: "-- --shard=9/20"
            cache_key: "traycer-clients-gui-app-9-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 10 of 20)"
            test_args: "-- --shard=10/20"
            cache_key: "traycer-clients-gui-app-10-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 11 of 20)"
            test_args: "-- --shard=11/20"
            cache_key: "traycer-clients-gui-app-11-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 12 of 20)"
            test_args: "-- --shard=12/20"
            cache_key: "traycer-clients-gui-app-12-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 13 of 20)"
            test_args: "-- --shard=13/20"
            cache_key: "traycer-clients-gui-app-13-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 14 of 20)"
            test_args: "-- --shard=14/20"
            cache_key: "traycer-clients-gui-app-14-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 15 of 20)"
            test_args: "-- --shard=15/20"
            cache_key: "traycer-clients-gui-app-15-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 16 of 20)"
            test_args: "-- --shard=16/20"
            cache_key: "traycer-clients-gui-app-16-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 17 of 20)"
            test_args: "-- --shard=17/20"
            cache_key: "traycer-clients-gui-app-17-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 18 of 20)"
            test_args: "-- --shard=18/20"
            cache_key: "traycer-clients-gui-app-18-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 19 of 20)"
            test_args: "-- --shard=19/20"
            cache_key: "traycer-clients-gui-app-19-of-20"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 20 of 20)"
            test_args: "-- --shard=20/20"
            cache_key: "traycer-clients-gui-app-20-of-20"
          - project: "@traycer-clients/desktop"
            name: "test (@traycer-clients/desktop)"
            test_args: ""
            cache_key: "@traycer-clients/desktop"
          - project: "@traycer-clients/mobile"
            name: "test (@traycer-clients/mobile)"
            test_args: ""
            cache_key: "@traycer-clients/mobile"
          - project: "@traycer-clients/shared"
            name: "test (@traycer-clients/shared)"
            test_args: ""
            cache_key: "@traycer-clients/shared"
          - project: "@traycer-clients/traycer-cli"
            name: "test (@traycer-clients/traycer-cli)"
            test_args: ""
            cache_key: "@traycer-clients/traycer-cli"
          # Repo-root `scripts/`, which owns the packaging tests - including
          # the verification of the official Node tarball the SEA build
          # downloads and extracts. Without this row the project's `test`
          # target exists and nothing in CI ever calls it.
          - project: scripts
            name: "test (scripts)"
            test_args: ""
            cache_key: "scripts"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - name: Cache bun global install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The host-v1.1.5 oracle in `provider-native-schemas.test.ts` regenerates
      # the checked-in fixture straight from the tag and deep-equals the two.
      # `actions/checkout` fetches no tags, so without this it skips itself and
      # the check never runs anywhere: `guarded-files-tripwire` only catches a
      # hand-edit to the fixture, NOT a generator that has drifted away from it.
      #
      # A shallow single-tag fetch is enough — the tag's commit arrives with a
      # complete tree, so the blobs the oracle reads are all present (~2s, ~6MB;
      # a full `fetch-depth: 0` clone would buy nothing here).
      - name: Fetch the host-v1.1.5 tag the schema oracle regenerates from
        if: matrix.project == '@traycer/protocol'
        run: git fetch --depth=1 origin tag host-v1.1.5
      # `--outputStyle=stream` sends the child's stdout/stderr straight to the
      # step log. Nx's default buffers it into an internal stream and replays
      # it AFTER the failure banner, capped — so a failing gui-app job printed
      # its banner, then a truncated replay that cut off mid-line before
      # Vitest's summary and, on three occasions, before the `×` lines naming
      # the failed tests. That reads exactly like a killed process (no summary,
      # log ends mid-write, exit 1) and was triaged as an OOM for a day; the
      # tests had been failing on plain assertions the whole time. Streaming
      # also puts the output back in causal order, which the replay scrambles.
      #
      # It REPLACES `--tui=false` rather than joining it: Nx rejects the two
      # together ("Arguments tui and outputStyle are mutually exclusive") and
      # exits 1 before running anything, which would redden every job here.
      # `stream` is already a non-TUI style, so nothing is lost.
      #
      # The GUI's real-browser regressions do not run here: they have their own
      # workflow, `browser-regressions.yml`, which runs them in parallel jobs.
      # Serially at the end of gui-app shard 1 they took this required check
      # from about 7 minutes to about 35.
      #
      # `shell: bash` is what adds `-o pipefail` (the implicit shell has only
      # `-e`), so `tee` cannot turn a red run green. The log it keeps is what
      # the diagnostics step below reads for its verdict.
      #
      # The gui-app shards also log per-file heap, so a growing file is named,
      # and write JUnit, which reaches a file without going through this pipe.
      # Naming reporters replaces vitest's defaults, so all of them are listed.
      - name: Test
        shell: bash
        env:
          TEST_EVIDENCE_ARGS: ${{ matrix.project == 'traycer-clients-gui-app' && format('--logHeapUsage --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit={0}/test-junit.xml', github.workspace) || '' }}
        run: bunx nx run-many --target=test --projects="${{ matrix.project }}" --outputStyle=stream ${{ matrix.test_args }} $TEST_EVIDENCE_ARGS 2>&1 | tee test-output.log
      # Fails on a protocol test file whose hooks and tests took over 10 s that
      # `protocol/test-budget-allowlist.json` does not name with a reason, after
      # running it once more alone (`protocol/scripts/test-budget.ts`).
      - name: Test file budget
        if: matrix.project == '@traycer/protocol'
        run: bun protocol/scripts/test-budget.ts protocol/test-results/junit.xml
      # A killed fork leaves the file it was running unfinished, and gui-app's
      # `dangerouslyIgnoreUnhandledErrors` still lets vitest exit 0, so the shard
      # would report green with those tests unrun. None of 740 green jobs on
      # `main` from 28 Oct to 2 Nov 2026 had a dead fork, so this has held by
      # luck, not by a check. The verdict is read from vitest's own record of
      # its unhandled errors in the JUnit report, not from the log, where a
      # test may print anything. A green run with no readable report proves
      # nothing, so it fails too.
      - name: Fail a green run whose test fork died
        if: matrix.project == 'traycer-clients-gui-app'
        shell: python3 {0}
        run: |
          import glob
          import sys
          import xml.etree.ElementTree as ET

          # Shard 1 also runs the react-compiler files, each in its own vitest
          # process with its own report beside the main one
          # (`clients/gui-app/scripts/run-tests.ts`).
          paths = sorted(set(["test-junit.xml"] + glob.glob("test-junit-*.xml")))
          deaths = []
          for path in paths:
              try:
                  report = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as error:
                  print(f"::error::No readable JUnit report at {path} ({error}), so this green run proves nothing.")
                  sys.exit(1)
              deaths += [
                  f"{path}: {(error.text or '').strip()}"
                  for suite in report.iter("testsuite")
                  if suite.get("name") == "vitest unhandled errors"
                  for error in suite.iter("error")
                  if "Worker exited unexpectedly" in (error.text or "")
              ]
          for death in deaths:
              print(death)
          if deaths:
              print("::error::A test fork died, so its test file did not finish. vitest exited 0 because gui-app ignores unhandled errors.")
              sys.exit(1)
      # `always()`, so a red shard can be compared with a green one. vitest
      # writes the file when the run ends: a fork's death still leaves a report,
      # a killed vitest parent leaves an empty file. A replay from the Nx cache
      # leaves none, so a missing file is not an upload failure. Kept for the
      # repository's retention, the same seven days as the job log.
      - name: Upload the JUnit report
        if: always() && matrix.project == 'traycer-clients-gui-app'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.cache_key }}
          path: test-junit*.xml
          if-no-files-found: ignore
      # Says first whether a process died, because this step runs on every red
      # job and most are plain assertion failures: of 220 failed jobs on `main`
      # from 27 Oct to 2 Nov 2026, all 220 printed a vitest summary and one
      # named a dead worker. Nx exits 1 for any failed task, so its exit code
      # cannot tell them apart; the log can. vitest names a dead fork's signal
      # and the file it was running, `clients/gui-app/scripts/run-tests.ts`
      # names a killed vitest, and bun names a killed script.
      #
      # `dmesg` names an OOM kill and its victim; the memory/disk lines bound
      # the alternative (a full tmpfs, an exhausted runner). `|| true`
      # throughout: this step must never convert a diagnostic gap into a
      # second failure.
      - name: Capture runner diagnostics on test failure
        if: failure()
        run: |
          echo "::group::Why this job failed"
          if [ ! -f test-output.log ]; then
            echo "The Test step never ran: a step before it failed."
          else
            sed -E 's/\x1b\[[0-9;]*m//g' test-output.log >/tmp/test-output.txt || true
            deaths=$(grep -E "Worker exited unexpectedly|vitest was killed by|was terminated by signal" /tmp/test-output.txt | tail -20 || true)
            if [ -n "$deaths" ]; then
              echo "A PROCESS DIED:"
              echo "$deaths"
            elif grep -qE "Test Files +[0-9]+ failed" /tmp/test-output.txt; then
              echo "NO PROCESS DIED: vitest finished and reported failing tests, named in the log above."
              echo "The kernel, memory and disk sections below are not about this failure."
            elif grep -q "Test Files " /tmp/test-output.txt; then
              echo "NO PROCESS DIED: vitest finished with no failed file. Read its Errors line in the log above."
            else
              echo "vitest printed no summary and nothing named a signal: it did not start, or its output was lost."
            fi
          fi
          echo "::endgroup::"
          echo "::group::Kernel OOM / kill records"
          # Capture dmesg FIRST, then grep, and report which case we are in.
          # Piping dmesg straight into grep makes "dmesg is not readable"
          # indistinguishable from "no OOM records" - both render as an empty
          # section, which is the one ambiguity this step exists to remove.
          # The kernel log needs root here, and the hosted runner's sudo asks
          # for no password.
          if sudo -n dmesg -T >/tmp/dmesg.txt 2>/dev/null; then
            # Test grep with -q SEPARATELY from printing. `grep ... | tail`
            # reports tail's status, which is 0 even when grep matched
            # nothing - so the pipeline form would claim OOM records exist
            # every time. A diagnostic that invents the very finding it is
            # meant to adjudicate is worse than no diagnostic at all.
            if grep -qiE "killed process|out of memory|oom[-_]kill" /tmp/dmesg.txt; then
              grep -iE "killed process|out of memory|oom[-_]kill" /tmp/dmesg.txt | tail -40
              echo "(OOM records found above)"
            else
              echo "dmesg READ OK, and it contains NO OOM/kill records."
            fi
          else
            echo "dmesg NOT READABLE on this runner."
          fi
          echo "::endgroup::"
          echo "::group::Memory"
          free -m 2>/dev/null || true
          cat /proc/meminfo 2>/dev/null | head -5 || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h 2>/dev/null | head -10 || true
          echo "::endgroup::"

  # The one required check for the whole matrix above. The `main` ruleset used to
  # require four matrix names (`test (@traycer/protocol)`,
  # `test (traycer-clients-gui-app)`, `test (@traycer-clients/desktop)` and
  # `test (@traycer-clients/traycer-cli)`), but a matrix job skipped by a job-level
  # `if` is never expanded, so on a team PR those names would never report and
  # would block the merge. This job is skipped as a whole there, and a skipped job
  # satisfies a required check. When it runs it fails unless every leg passed;
  # `always()` makes it report even when a leg failed or was cancelled.
  tests:
    name: tests
    needs: [test]
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      always() && (
        github.event_name != 'pull_request'
        || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every test leg passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  # Windows job: the ONLY Windows execution of CLI code in PR CI. Until this
  # existed, `smoke:sea` ran solely inside the release workflows, so every
  # Windows claim in the CLI was unexecuted until a release — which is how the
  # win32 SEA exit-teardown abort (int#4840) reached two users' machines.
  #
  # It builds the real SEA artifact and loops `host available --json`, the exact
  # command both field reports died on. The gate is "a successful terminal
  # envelope implies exit 0", not "exit 0" — see the script header for why that
  # distinction keeps registry flakiness from turning this red.
  #
  # Deliberately NOT path-filtered to `clients/traycer-cli/**`, even though the
  # SEA build eats much of the ten-minute job cap: the exit path's behaviour
  # depends on dependencies it does not own — undici's global dispatcher and the
  # Sentry client are the two handles the teardown races against — so a
  # `bun.lock` bump is exactly a change that could reintroduce this while
  # touching no CLI file. A gate that skips on the riskiest diffs is not a gate.
  test-windows-cli-exit:
    name: test (cli win32 SEA exit code)
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      # The standard runner starts immediately. A larger runner queued for
      # more than three minutes, while cache restore on this runner took 3m27
      # plus a 32s install versus 3m51 for the uncached install below.
      - run: bun install --frozen-lockfile
      - name: Build the CLI SEA
        run: bun run --filter @traycer-clients/traycer-cli build:sea
      # Proves the artifact runs at all before the loop below attributes an
      # exit code to the teardown race.
      - name: SEA smoke
        run: bun run --filter @traycer-clients/traycer-cli smoke:sea
      - name: Exit-code repro loop
        run: bun run --filter @traycer-clients/traycer-cli smoke:exit-code
      # The only Windows run of the host-lock verifying read against a real
      # process whose exact read is DENIED. The runner is elevated: its token
      # holds SeDebugPrivilege, and every PowerShell the reader starts would
      # enable it and read every process. The wrapper removes the privilege
      # from the token this run inherits; the test fails under CI if it is
      # still held.
      - name: Denied-read fallback, a real denied read
        working-directory: clients/shared
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File host-lock/__tests__/run-without-sedebug.ps1 bunx vitest run host-lock/__tests__/process-identity-windows-denied-read.win32.test.ts
      # The update-recovery reader builds its open() flags from the constants
      # the platform defines, and Windows defines none of O_NOFOLLOW,
      # O_NONBLOCK and O_NOCTTY. This runs the real reader where they are
      # missing: a real file must still verify and a missing one must still
      # read as missing.
      - name: Update-recovery reader, real Windows open flags
        working-directory: clients/traycer-cli
        run: bunx vitest run src/host/__tests__/update-recovery-evidence-flag-fallback-real-platform.test.ts
      # The only Windows run of the settings lock (`config.json.lock`) against
      # the real filesystem: the lock's create, a peer's release and the
      # rename over `config.json`, with several processes changing settings
      # in one home at once. No write may be lost.
      - name: Settings lock, concurrent writers on real Windows
        working-directory: protocol
        run: bunx vitest run src/config/__tests__/store-lock-multiprocess.test.ts
      # The only real run of the CLI finalize helper's Windows launch. A
      # detached spawn there exits 0 having run no line of the script, and no
      # stubbed test can see that: this starts a marker-only helper through
      # the production launcher and checks it arms and outlives the process
      # that launched it, and that a helper the CLI abandoned exits without
      # finalizing (upgrade/finalize-helper.ts, "Launching on Windows").
      - name: Finalize helper launch, a real PowerShell handoff
        working-directory: clients/traycer-cli
        run: bunx vitest run src/upgrade/__tests__/finalize-helper-launch.win32.test.ts

  # Decides whether the macOS job below has anything to test. It is the
  # slowest job in this workflow by minutes (a real electron-builder pack), and
  # most merges change nothing it covers.
  macos-packaging-changes:
    name: test (desktop darwin + packaging) changes
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `actions: read` lets the push step below list this workflow's earlier runs.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A push run is compared with the last push this workflow PASSED on, not
      # with the push before it. A team PR is not tested before it merges, so a
      # red merge would otherwise be forgotten by the next one: A breaks the
      # pack, B changes a doc, B's range is only the doc, and the skipped job on
      # B is green. From the last green push, B's range still holds A's change
      # and the pack runs again.
      - name: Find the last green push to compare against
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(scripts/ci-last-green-sha.sh test.yml "$BRANCH" "$BEFORE")"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      # What the macOS job covers that no Linux job does: the real pack and the
      # darwin-only test files it names. So the list is the desktop workspace
      # (`clients/desktop/`, which holds the electron-builder config, its hook
      # and every script the pack runs; the pack copies a README out of it, so
      # not even Markdown there is free), the release-target stamp those
      # scripts read (`clients/scripts/`), `@traycer-clients/shared` and the
      # parts of `@traycer/protocol` the darwin-only files import, the Electron
      # and electron-builder pins and everything else that can move them
      # (`package.json`, `bun.lock`), the one patch in the pack's own toolchain
      # (`app-builder-lib`), and this workflow.
      # `clients/desktop/scripts/__tests__/macos-ci-job.test.ts` holds the
      # imports to this list. `-z`, so a path that is not plain ASCII arrives
      # as its raw bytes rather than in git's display quoting, which every
      # match would fail on. `--no-renames` reports a moved file at both its
      # old path and its new one, so a file moved out of a listed path still
      # counts.
      #
      # The rest of `protocol/`, `clients/gui-app/` and the other patches are
      # deliberately absent. The pack bundles them, and the only thing this job
      # asserts about them is that the bundle builds; the `build` lane of
      # `pre-commit.yml` builds the desktop app on Linux whenever one of them
      # changes, so a bundle that no longer builds is caught there. The rest of
      # what it asserts (the bundled CLI's arch, mode and version file, the
      # helper app and its plists) they do not feed.
      #
      # A push with no usable base (a new branch) and a manual run always run
      # the job.
      - name: Does this change touch what the macOS job covers?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push)
              if [ -z "$PUSH_BASE" ] || ! git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "No earlier commit to diff against: running the macOS job."
                exit 0
              fi
              range="$PUSH_BASE..HEAD" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "A $EVENT run always runs the macOS job."
              exit 0 ;;
          esac
          relevant=$(git diff -z --name-only --no-renames "$range" | tr '\0' '\n' | awk '
            /^clients\/desktop\// || /^clients\/scripts\// ||
            /^clients\/shared\// ||
            /^protocol\/src\/(auth|config|framework)\// ||
            /^protocol\/src\/host\/(browser\/|lifecycle|resource-scope|version-order)/ ||
            /^protocol\/utils\/text\// ||
            /^patches\/app-builder-lib@/ ||
            /^package\.json$/ || /^bun\.lock$/ ||
            /^\.github\/workflows\/test\.yml$/ { print }
          ')
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Running the macOS job; it covers:\n%s\n' "$relevant"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the macOS job covers changed: skipping it."
          fi

  # macOS job: the real electron-builder pack, plus the desktop test files only
  # macOS can run (`skipIf(platform !== "darwin")` blocks that spawn the real
  # `codesign` and `plutil`, and files that reach production's darwin branches
  # without forcing `process.platform`). Without this job the release-critical
  # helper/plist injection (BundleProgram relativity, NumberOfFiles=8192,
  # relocation, real-pack wiring) has no CI coverage at all. The rest of the
  # desktop suite runs on Linux, in the `test` matrix above. Every
  # launchctl-adjacent test forces `process.platform` OFF darwin internally, so
  # nothing in this job can touch the runner's real launchd/BTM state.
  #
  # The Electron zips the pack downloads are the one cache here: 235 MB restores
  # in 2 s. Bun's package cache is not: its 885 MB took 138 s to restore, and
  # the install it replaces takes under 30 s uncached.
  #
  # It runs when `macos-packaging-changes` says the change touches what it
  # covers. It is not a required check, so a skipped run holds no pull
  # request; a failed `macos-packaging-changes` skips it too, and that
  # failure is itself a red check on the pull request.
  test-macos-packaging:
    name: test (desktop darwin + packaging)
    needs: macos-packaging-changes
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      (
        github.event_name != 'pull_request'
        || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
      && needs.macos-packaging-changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - run: bun install --frozen-lockfile
      - name: Read the installed Electron version
        id: electron
        working-directory: clients/desktop
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      # Every file the suite marks darwin-only, and the files that reach a
      # production branch macOS takes and Linux does not without forcing
      # `process.platform`: the shortcut, window and preload branches, and the
      # real `ps` the credentials lock and the host's process identity read.
      # `clients/desktop/scripts/__tests__/macos-ci-job.test.ts` requires every
      # darwin-gated file to be named here.
      - name: Desktop darwin-only test files
        working-directory: clients/desktop
        run: >-
          bunx vitest run
          scripts/prepack/__tests__/inject-host-launch-agent.test.ts
          src/electron-main/app/__tests__/shortcuts.test.ts
          src/electron-main/auth/__tests__/file-token-store.test.ts
          src/electron-main/host/__tests__/host-state-busy-verdict.test.ts
          src/electron-main/windows/__tests__/window-factory.test.ts
          src/electron-main/windows/__tests__/window-zoom.test.ts
          src/electron-preload/__tests__/preload-bridge.test.ts
      # the shared exec-sync-stderr off-Linux case never ran in CI
      # (shared tests are Linux-only; this job is the macOS lane).
      - name: Shared exec-sync stderr (darwin-gated blocks)
        working-directory: clients/shared
        run: bunx vitest run __tests__/exec-sync-stderr.test.ts
      - name: Real electron-builder packaging test
        run: bun run test:packaging
        working-directory: clients/desktop
