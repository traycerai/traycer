name: Row 21 GUI v9 diagnostic witness
run-name: Row 21 GUI v9 diagnostic · exact 642e064c
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  named-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 2ea9cbbdc1ec11ea8edaf033261405c7b19ac029
          persist-credentials: false
      - name: Verify the qualified checkout
        run: |
          test "$(git rev-parse HEAD)" = 2ea9cbbdc1ec11ea8edaf033261405c7b19ac029
          test "$(git rev-parse 'HEAD^{tree}')" = 642e064cf3723b5222f26549bd6906ac5e38306f
      - uses: ./.github/actions/bootstrap-ci-tools
        with:
          mirror-base-url: ${{ vars.CI_TOOLS_MIRROR_BASE_URL }}
          bun-version: "1.4.4"
          tools: node bun electron
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun run --cwd clients/desktop install-electron
      - name: Run the exact Row 21 case once
        id: named
        continue-on-error: true
        working-directory: clients/gui-app
        run: |
          bunx vitest run src/components/settings/panels/__tests__/shell-settings-panel.test.tsx \
            -t "applies Y's edit to X while X keeps its own value and note$" --retry=0 \
            --reporter=junit --outputFile.junit="$RUNNER_TEMP/row21-raw.xml"
      - name: Retain sanitized per-case JUnit
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          import xml.etree.ElementTree as ET
          dest = Path(os.environ["RUNNER_TEMP"])
          raw = dest / "row21-raw.xml"
          suite = ET.Element("testsuite", name="Row 21 GUI v9 diagnostic")
          if raw.exists():
              for case in ET.parse(raw).iter("testcase"):
                  name = case.get("name", "")
                  if not name.endswith("applies Y's edit to X while X keeps its own value and note"):
                      continue
                  out = ET.SubElement(suite, "testcase", name=name, time=case.get("time", "0"))
                  for element in case:
                      if element.tag not in ("failure", "error", "skipped"):
                          continue
                      body = (element.get("message", "") or "") + "\n" + (element.text or "")
                      frame = re.search(r"shell-settings-panel\.test\.tsx:\d+:\d+", body)
                      status = {"failure": "Assertion failed", "error": "Case error", "skipped": "Case skipped"}[element.tag]
                      first = (element.get("message") or "").splitlines()
                      if first:
                          approved = re.search(r"expected (?:true|false) to be (?:true|false)|Test timed out in \d+ms",first[0])
                          if approved:
                              status = approved[0]
                      if frame and frame[0].startswith("shell-settings-panel.test.tsx:3108:"):
                          status += " at xFieldHasPersonalEdit"
                      child = ET.SubElement(out, element.tag, message=status)
                      child.text = frame[0] if frame else ""
                  print("Row 21 GUI case", name, next((part.get("message") for part in out), "PASS"))
          raw.unlink(missing_ok=True)
          suite.set("tests", str(len(suite)))
          ET.ElementTree(suite).write(dest / "row21-gui-v9-named-junit.xml", encoding="utf-8", xml_declaration=True)
          if len(suite) != 1:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: row21-gui-v9-named-junit
          path: ${{ runner.temp }}/row21-gui-v9-named-junit.xml
          if-no-files-found: error
      - name: Preserve first-attempt test outcome
        if: always()
        run: test "${{ steps.named.outcome }}" = success
