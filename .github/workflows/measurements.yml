name: Measurements

# The long forms of suites the merge run sizes by case count. Every push runs
# enough cases to catch a regression in its own time; this runs the rest once a
# night, on the standard runner, which is free on this public repository.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-long-forms:
    name: protocol long forms
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - run: bun install --frozen-lockfile
      - name: Fuzz every seed
        working-directory: protocol
        env:
          HOST_MEASUREMENT_FULL: "1"
        run: >-
          bun run vitest run
          src/config/__tests__/adversarial-store-fuzz.test.ts
          src/persistence/chat-transcript/__tests__/row-fold-parity.test.ts
