name: Measurements

# The gui-app's time and size budgets at full scale (`*.measure.ts`), too long
# for the push run. Nightly on the standard runner, about 3 minutes; a failed
# run here is the signal, and it holds no merge. No secrets.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurements:
    name: measurements (gui-app)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - run: bun install --frozen-lockfile
      - name: Run the measurements
        working-directory: clients/gui-app
        run: bunx vitest run --config vitest.measurements.config.ts
