name: publish-desktop-windows-package-managers

# winget + Scoop publisher for Traycer Desktop (runs in the PUBLIC OSS repo).
#
# Auto-triggers when a stable desktop-v<version> GitHub Release is published
# here (release: released never fires for prereleases, so RC tags are excluded).
# Also dispatchable by tag for manual re-runs.
#
# Both channels ship the release's signed NSIS installer unchanged and publish
# through a PULL REQUEST, never a direct push:
#   - winget: `wingetcreate submit` opens a PR on microsoft/winget-pkgs from the
#     fork of the account that owns TRAYCER_WINGET_TOKEN; Microsoft's
#     validation and moderators merge it.
#   - Scoop: a PR on the TRAYCER_SCOOP_BUCKET_REPO bucket; merging it is the
#     human gate, as with the Homebrew cask.
# A channel whose secrets are unset is skipped with a notice, so the workflow
# renders, validates and smoke-installs without publishing anything until
# provisioned.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag to publish (e.g. desktop-v1.6.0)"
        required: true
        type: string
      dry_run:
        description: "Render and smoke-install only; open no winget or Scoop PR."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  render:
    name: Render winget + Scoop manifests
    # Skip non-desktop release events (cli-v*/host-v* also fire `released`).
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Parse tag into version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$RELEASE_TAG"
          fi
          if [[ "$tag" != desktop-v* ]]; then
            echo "::error::Tag '$tag' must be a desktop release tag of the form desktop-v<semver> (e.g. desktop-v1.6.0)."
            exit 1
          fi
          version="${tag#desktop-v}"
          # Stable versions only: winget and Scoop users get no release
          # candidates, and both manifests key on a plain X.Y.Z.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version' parsed from tag '$tag'. Expected a stable X.Y.Z (e.g. 1.6.0)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - name: Download the Windows installer from the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "desktop-v${VERSION}" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "::error::Release 'desktop-v${VERSION}' does not exist on ${RELEASE_REPO}."
            exit 1
          fi
          mkdir -p desktop-artifacts
          gh release download "desktop-v${VERSION}" \
            --repo "$RELEASE_REPO" \
            --pattern "traycer-desktop-windows-x64.exe" \
            --dir desktop-artifacts \
            --clobber
          test -f desktop-artifacts/traycer-desktop-windows-x64.exe
      - name: Render manifests
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/${RELEASE_REPO}/releases/download/desktop-v${VERSION}"
          win_sha="$(sha256sum desktop-artifacts/traycer-desktop-windows-x64.exe | awk '{print $1}')"
          node scripts/native-packaging/publish-cli-package-managers.cjs \
            --desktop-winget \
            --desktop-scoop \
            --version "$VERSION" \
            --release-repo "$RELEASE_REPO" \
            --staging staging \
            --win-x64-url "${base_url}/traycer-desktop-windows-x64.exe" \
            --win-x64-sha256 "$win_sha"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-manifests
          path: |
            staging/winget
            staging/scoop

  scoop-smoke:
    name: Smoke-install the Scoop manifest
    needs: render
    # No `environment` and no secrets: this job runs Scoop's own installer.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows-manifests
          path: manifests
      - name: Install Scoop
        shell: pwsh
        run: |
          # The runner is elevated; Scoop's installer refuses that without
          # -RunAsAdmin.
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install, check and uninstall traycer-desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Scoop reads a relative `x/rest.json` as app `rest.json` in a bucket
          # named `x`; an absolute path is read as a local manifest.
          $manifest = (Resolve-Path 'manifests\scoop\bucket\traycer-desktop.json').Path
          scoop install $manifest
          if ($LASTEXITCODE -ne 0) { throw "scoop install failed ($LASTEXITCODE)" }
          $app = scoop prefix traycer-desktop
          foreach ($required in @('Traycer.exe', 'resources\app-update.yml', 'resources\cli\win32-x64\traycer.exe')) {
            if (-not (Test-Path (Join-Path $app $required))) { throw "Scoop install is missing $required" }
          }
          $marker = Get-Content -Raw (Join-Path $app 'resources\package-type')
          if ($marker -ne 'scoop') { throw "resources\package-type is '$marker', expected 'scoop'" }
          scoop uninstall traycer-desktop
          if ($LASTEXITCODE -ne 0) { throw "scoop uninstall failed ($LASTEXITCODE)" }
      - name: Uninstall leaves a separately installed CLI's host autostart
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The uninstaller removes this account's host task and launcher only
          # when the CLI install manifest says exactly `desktop`. A CLI
          # installed some other way keeps running the host after Desktop is
          # gone, and a missing or malformed manifest proves nothing, so all
          # of those keep them. The JSON is written as literal text so that
          # no cmdlet reshapes the array cases.
          $manifest = (Resolve-Path 'manifests\scoop\bucket\traycer-desktop.json').Path
          $cliHome = Join-Path $env:USERPROFILE '.traycer\cli'
          $launcher = Join-Path $cliHome 'host-start-hidden.vbs'
          $cliManifest = Join-Path $cliHome 'manifest.json'
          # Fixtures are created only on a runner that holds none of them, so
          # whatever exists at cleanup was created here.
          schtasks /Query /TN '\Traycer\Host' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "refusing to run: \Traycer\Host already exists and is not a fixture of this job" }
          foreach ($existing in @($cliManifest, $launcher)) {
            if (Test-Path $existing) { throw "refusing to run: $existing already exists and is not a fixture of this job" }
          }
          $createdHome = -not (Test-Path $cliHome)
          try {
            New-Item -ItemType Directory -Force -Path $cliHome | Out-Null
            $cases = @(
              @{ Name = 'npm'; Json = '{"source":"npm"}'; Kept = $true },
              @{ Name = 'missing manifest'; Json = $null; Kept = $true },
              @{ Name = 'source array'; Json = '{"source":["desktop","npm"]}'; Kept = $true },
              @{ Name = 'root array'; Json = '[{"source":"desktop"}]'; Kept = $true },
              @{ Name = 'desktop'; Json = '{"source":"desktop"}'; Kept = $false }
            )
            $failures = @()
            foreach ($case in $cases) {
              if ($null -eq $case.Json) {
                Remove-Item $cliManifest -Force -ErrorAction SilentlyContinue
              } else {
                Set-Content -Path $cliManifest -Value $case.Json -Encoding ascii
              }
              Set-Content -Path $launcher -Value "' launcher" -Encoding ascii
              schtasks /Create /TN '\Traycer\Host' /TR 'cmd.exe /c exit 0' /SC ONCE /ST 23:59 /F 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "schtasks /Create failed ($LASTEXITCODE)" }
              scoop install $manifest
              if ($LASTEXITCODE -ne 0) { throw "scoop install failed ($LASTEXITCODE)" }
              scoop uninstall traycer-desktop
              if ($LASTEXITCODE -ne 0) { throw "scoop uninstall failed ($LASTEXITCODE)" }
              schtasks /Query /TN '\Traycer\Host' 2>$null | Out-Null
              $task = $LASTEXITCODE -eq 0
              $file = Test-Path $launcher
              if (($task -ne $case.Kept) -or ($file -ne $case.Kept)) { $failures += "CLI manifest '$($case.Name)': task present $task, launcher present $file; expected $($case.Kept)" }
            }
            if ($failures.Count -gt 0) { throw ($failures -join '; ') }
          } finally {
            schtasks /Delete /TN '\Traycer\Host' /F 2>$null | Out-Null
            Remove-Item $cliManifest, $launcher -Force -ErrorAction SilentlyContinue
            if ($createdHome -and (Test-Path $cliHome) -and -not (Get-ChildItem -Force $cliHome)) { Remove-Item $cliHome -Force }
          }
          $global:LASTEXITCODE = 0
      - name: The NSIS uninstaller's ownership probe answers 5 unless the manifest says desktop
        # Runs after a red Scoop step too, so one run shows every malformed case.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Runs the committed probe text itself under Windows PowerShell 5.1
          # (what the NSIS uninstaller launches). It proves the probe's
          # PowerShell semantics, not makensis or an installed uninstaller.
          # Only this one known -Command text is taken from the file.
          $nsh = Get-Content -Raw -LiteralPath 'clients\desktop\resources\bundle\uninstall-host-autostart.nsh'
          $lines = @($nsh -split "\r?\n" | Where-Object { $_ -match '^\s*nsExec::ExecToLog /TIMEOUT=30000 `powershell ' -and $_ -match 'Definition\.Principal\.UserId' })
          if ($lines.Count -ne 1) { throw "expected exactly one ownership probe line, found $($lines.Count)" }
          if ($lines[0] -notmatch '-Command "(.*)"`\s*$') { throw 'the ownership probe line has no -Command "..." text' }
          $probe = $Matches[1].Replace('$$', '$')
          foreach ($name in @('TRAYCER_CLI_MANIFEST_TAIL', 'TRAYCER_WINDOWS_TASK_NAME')) {
            if ($nsh -notmatch "(?m)^!define $name `"([^`"]*)`"\s*$") { throw "no default !define for $name" }
            $probe = $probe.Replace('${' + $name + '}', $Matches[1])
          }
          if ($probe.Contains('${')) { throw 'the probe still holds an unsubstituted NSIS symbol' }
          if ($probe.Contains('"')) { throw 'the probe holds a double quote and cannot be passed as one -Command argument' }

          $cliHome = Join-Path $env:USERPROFILE '.traycer\cli'
          $cliManifest = Join-Path $cliHome 'manifest.json'
          $launcher = Join-Path $cliHome 'host-start-hidden.vbs'
          schtasks /Query /TN '\Traycer\Host' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "refusing to run: \Traycer\Host already exists and is not a fixture of this job" }
          foreach ($existing in @($cliManifest, $launcher)) {
            if (Test-Path $existing) { throw "refusing to run: $existing already exists and is not a fixture of this job" }
          }

          function Invoke-Probe {
            $info = [System.Diagnostics.ProcessStartInfo]::new('powershell.exe')
            foreach ($arg in @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-Command', $probe)) { $info.ArgumentList.Add($arg) }
            $info.UseShellExecute = $false
            $process = [System.Diagnostics.Process]::Start($info)
            if (-not $process.WaitForExit(30000)) {
              $process.Kill($true)
              throw 'the ownership probe did not finish within 30 seconds'
            }
            return $process.ExitCode
          }

          $createdHome = -not (Test-Path $cliHome)
          try {
            New-Item -ItemType Directory -Force -Path $cliHome | Out-Null
            # A task of this account's, so only the manifest decides.
            schtasks /Create /TN '\Traycer\Host' /TR 'cmd.exe /c exit 0' /SC ONCE /ST 23:59 /F 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Create failed ($LASTEXITCODE)" }
            $cases = @(
              @{ Name = 'desktop'; Json = '{"source":"desktop"}'; Exit = 0 },
              @{ Name = 'npm'; Json = '{"source":"npm"}'; Exit = 5 },
              @{ Name = 'missing manifest'; Json = $null; Exit = 5 },
              @{ Name = 'source array'; Json = '{"source":["desktop","npm"]}'; Exit = 5 },
              @{ Name = 'root array'; Json = '[{"source":"desktop"}]'; Exit = 5 }
            )
            $failures = @()
            foreach ($case in $cases) {
              if ($null -eq $case.Json) {
                Remove-Item $cliManifest -Force -ErrorAction SilentlyContinue
              } else {
                Set-Content -Path $cliManifest -Value $case.Json -Encoding ascii
              }
              $code = Invoke-Probe
              Write-Host "probe '$($case.Name)': exit $code (expected $($case.Exit))"
              if ($code -ne $case.Exit) { $failures += "'$($case.Name)' exited $code, expected $($case.Exit)" }
            }
            if ($failures.Count -gt 0) { throw ("ownership probe: " + ($failures -join '; ')) }
          } finally {
            schtasks /Delete /TN '\Traycer\Host' /F 2>$null | Out-Null
            Remove-Item $cliManifest, $launcher -Force -ErrorAction SilentlyContinue
            if ($createdHome -and (Test-Path $cliHome) -and -not (Get-ChildItem -Force $cliHome)) { Remove-Item $cliHome -Force }
          }
          $global:LASTEXITCODE = 0

  publish-scoop:
    name: PR traycer-desktop to the Scoop bucket
    needs: [render, scoop-smoke]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    concurrency:
      group: scoop-bucket-publish
      cancel-in-progress: false
    steps:
      - name: Check Scoop bucket secrets
        id: gate
        env:
          SCOOP_BUCKET_REPO: ${{ secrets.TRAYCER_SCOOP_BUCKET_REPO }}
          BUCKET_PUSH_TOKEN: ${{ secrets.TRAYCER_TAP_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SCOOP_BUCKET_REPO" || -z "$BUCKET_PUSH_TOKEN" ]]; then
            echo "::notice::TRAYCER_SCOOP_BUCKET_REPO or TRAYCER_TAP_PUSH_TOKEN is unset; skipping the Scoop bucket PR."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows-manifests
          path: manifests
      - name: Open the bucket PR
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.TRAYCER_TAP_PUSH_TOKEN }}
          BUCKET_REPO: ${{ secrets.TRAYCER_SCOOP_BUCKET_REPO }}
          VERSION: ${{ needs.render.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${BUCKET_REPO}.git" bucket
          cd bucket
          git config user.name "traycer-release-bot"
          git config user.email "release@traycer.ai"
          base="$(git symbolic-ref --short HEAD)"
          branch="traycer-desktop-${VERSION}"
          git checkout -B "$branch"
          mkdir -p bucket
          cp ../manifests/scoop/bucket/traycer-desktop.json bucket/traycer-desktop.json
          git add bucket/traycer-desktop.json
          if git diff --cached --quiet; then
            echo "::notice::traycer-desktop.json is already up to date for ${VERSION}; nothing to PR."
            exit 0
          fi
          git commit -m "traycer-desktop ${VERSION}"
          git push --force origin "$branch"
          existing="$(gh pr list --repo "$BUCKET_REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "::notice::PR #${existing} already open for ${branch}; updated its branch."
          else
            gh pr create --repo "$BUCKET_REPO" --base "$base" --head "$branch" \
              --title "traycer-desktop ${VERSION}" \
              --body "Automated Scoop manifest update for Traycer Desktop ${VERSION}, generated by publish-desktop-windows-package-managers.yml. Review and merge to publish."
          fi

  winget-validate:
    name: Validate the winget manifests
    needs: render
    # No `environment` and no secrets: this job runs winget's own validator on
    # the rendered files, so a dry run proves them before any submission.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows-manifests
          path: manifests
      - name: Validate with winget
        env:
          VERSION: ${{ needs.render.outputs.version }}
          WINGET_CLI_URL: https://github.com/microsoft/winget-cli/releases/download/v1.29.380/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle
          WINGET_CLI_SHA256: 65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # A pinned winget rather than whatever the runner image carries. The
          # App Installer bundle's x64 package holds winget.exe, which runs
          # unpacked, as Scoop's own winget package runs it.
          Invoke-WebRequest -Uri $env:WINGET_CLI_URL -OutFile winget-bundle.zip
          $actual = (Get-FileHash -Algorithm SHA256 winget-bundle.zip).Hash
          if ($actual -ne $env:WINGET_CLI_SHA256) { throw "App Installer bundle sha256 $actual does not match the pinned $env:WINGET_CLI_SHA256" }
          Expand-Archive winget-bundle.zip -DestinationPath winget-bundle
          $package = Get-ChildItem winget-bundle -Filter '*x64.msix' | Select-Object -First 1
          if (-not $package) { throw "The App Installer bundle has no x64 package" }
          Copy-Item $package.FullName winget-x64.zip
          Expand-Archive winget-x64.zip -DestinationPath winget-cli
          $winget = (Resolve-Path 'winget-cli\winget.exe').Path
          & $winget --version
          $manifest = (Resolve-Path "manifests\winget\manifests\t\Traycer\Desktop\$env:VERSION").Path
          # A warning exits non-zero as well as an error, and either fails here.
          & $winget validate --manifest $manifest --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }

  publish-winget:
    name: Submit Traycer.Desktop to winget
    needs: [render, winget-validate]
    if: ${{ inputs.dry_run != true }}
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    concurrency:
      group: winget-publish
      cancel-in-progress: false
    steps:
      - name: Check winget secret
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.TRAYCER_WINGET_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) {
            "::notice::TRAYCER_WINGET_TOKEN is unset; skipping the winget submission."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows-manifests
          path: manifests
      - name: Submit the manifest
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          # wingetcreate reads its token from this variable, which keeps the
          # token off the command line.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.TRAYCER_WINGET_TOKEN }}
          VERSION: ${{ needs.render.outputs.version }}
          WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:WINGETCREATE_URL -OutFile wingetcreate.exe
          $actual = (Get-FileHash -Algorithm SHA256 wingetcreate.exe).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe sha256 $actual does not match the pinned $env:WINGETCREATE_SHA256" }
          $manifest = (Resolve-Path "manifests\winget\manifests\t\Traycer\Desktop\$env:VERSION").Path
          .\wingetcreate.exe submit --no-open $manifest
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit failed ($LASTEXITCODE)" }
