name: Browser regressions

# The GUI's real-browser regressions (`clients/gui-app/scripts/*-browser*.mjs`):
# each driver starts its own Vite and a headless Chrome and drives it over CDP,
# for claims jsdom cannot decide - layout, painted pixels, real input dispatch.
#
# They used to run one after another at the end of gui-app Vitest shard 1 in
# `test.yml`, the one gui-app check the `main` ruleset requires. About 31
# minutes of drivers took that job from about 7 minutes to about 35 and held
# every PR behind it. Here they run as their own workflow, one parallel job per
# group of `clients/gui-app/scripts/run-browser-regressions.ts`, and are not a
# required check. No secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The group list lives in one place, the runner. The matrix below is read
  # from it, so a group added or renamed there cannot be silently skipped here.
  plan:
    name: browser regressions (plan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: List the groups
        id: groups
        working-directory: clients/gui-app
        run: echo "groups=$(bun scripts/run-browser-regressions.ts --list-groups)" >> "$GITHUB_OUTPUT"

  browser:
    name: browser (${{ matrix.group }})
    needs: plan
    runs-on: ubuntu-latest
    # The longest group runs about five minutes. The drivers are spawned with
    # no timeout of their own, so a hung Chrome or Vite would otherwise hold
    # the runner until GitHub's six-hour default.
    timeout-minutes: 20
    strategy:
      # One red group must not cancel the others: each proves different claims.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # The drivers start Vite under Node (`spawn("node", ...)`).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.20.0"
      - name: Cache bun global install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Browser regressions
        working-directory: clients/gui-app
        env:
          GROUP: ${{ matrix.group }}
        run: bun scripts/run-browser-regressions.ts --group "$GROUP"
