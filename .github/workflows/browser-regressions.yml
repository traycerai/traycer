name: Browser regressions

# The GUI's real-browser regressions: Playwright Test specs in
# `clients/gui-app/browser-tests/`, run against the fixture pages in
# `clients/gui-app/src/__tests__/browser/` in the runner's own Google Chrome,
# for claims jsdom cannot decide - layout, painted pixels, real input
# dispatch. See `clients/gui-app/browser-tests/README.md`.
#
# They used to be hand-rolled CDP drivers run one after another at the end of
# gui-app Vitest shard 1 in `test.yml`, the one gui-app check the `main`
# ruleset requires, and held every PR for about 30 minutes. Here they run as
# their own workflow, sharded, and only when a change touches what they
# depend on (the `changes` job's list): a PR or a push to main that does not
# skips them. Run workflow on the Actions tab runs them regardless.
#
# `browser regressions` (the last job) is the required check on `main`. It
# always reports, so a PR that skips the suite is not held waiting for it,
# and it fails when any job that ran failed. The shard jobs themselves are
# not required, so the shard count can change freely. No secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a pull request's runs supersede each other. A push to `main` gets its own
  # group (the run id): every merge is tested once, so a later merge must never
  # cancel an earlier merge's run, and a manual run is never cancelled either.
  group: browser-regressions-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: browser regressions (changes)
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref != 'main'
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` lets the push step below list this workflow's earlier runs.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A push run is compared with the last push this workflow PASSED on, not
      # with the push before it. A team PR runs no check before it merges, so a
      # red merge would otherwise be forgotten by the next one: A breaks the
      # suite, B changes a doc, B's range is only the doc, and the skipped run
      # on B is green. From the last green push, B's range still holds A's
      # change and the suite runs again.
      - name: Find the last green push to compare against
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(scripts/ci-last-green-sha.sh browser-regressions.yml "$BRANCH" "$BEFORE")"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      # What the suite depends on: the GUI app (its code, fixtures, specs and
      # configs), the two workspace packages it imports throughout
      # (`@traycer-clients/shared`, `@traycer/protocol`), the dependency set
      # and its patches (`@pierre/diffs`), the desktop package's Electron
      # (the tree-zoom spec launches it) and this workflow. A package is
      # listed whole, never by subdirectory: its exports reach past `src/`
      # (`@traycer/protocol/utils/*` is `protocol/utils/`). Markdown and
      # Vitest files change none of that. A push with no usable `before`
      # (a new branch) and a manual run always run the suite.
      - name: Does this change touch what the browser suite depends on?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push)
              if [ -z "$PUSH_BASE" ] || ! git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "No earlier commit to diff against: running the suite."
                exit 0
              fi
              range="$PUSH_BASE..HEAD" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "A $EVENT run always runs the suite."
              exit 0 ;;
          esac
          relevant=$(git diff --name-only "$range" | awk '
            /\.md$/ || /\.test\.tsx?$/ { next }
            /^clients\/gui-app\// || /^clients\/shared\// || /^protocol\// ||
            /^patches\// || /^package\.json$/ || /^bun\.lock$/ ||
            /^clients\/desktop\/package\.json$/ ||
            /^clients\/desktop\/scripts\/dev\/electron-binary\.cjs$/ ||
            /^\.github\/workflows\/browser-regressions\.yml$/ { print }
          ')
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Running the suite; it depends on:\n%s\n' "$relevant"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the browser suite depends on changed: skipping it."
          fi

  browser:
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      (
        github.event_name != 'pull_request'
        || github.base_ref != 'main'
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
      && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A shard runs a few minutes. Playwright bounds each test on its own
    # (`timeout` in playwright.config.ts); this bounds the job, so a hung
    # server or browser cannot hold the runner until GitHub's six-hour default.
    timeout-minutes: 20
    strategy:
      # One red shard must not cancel the others: each proves different claims.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # Playwright's CLI and the Vite server it starts both run under Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - name: Cache bun global install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Browser regressions
        working-directory: clients/gui-app
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bun run test:browser --shard="$SHARD"
      # The HTML report carries a trace of every failed attempt: open it with
      # `bunx playwright show-report <dir>` after downloading.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: clients/gui-app/playwright-report/
          retention-days: 14

  # The self-test of `clients/gui-app/scripts/cdp-client.mjs`, the CDP client
  # the manual browser drivers in `clients/gui-app/scripts/` still use: a
  # command in flight when Chrome dies must reject, not hang. It imports only
  # Node built-ins, so it needs no install.
  cdp-client:
    name: browser (cdp client)
    needs: changes
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      (
        github.event_name != 'pull_request'
        || github.base_ref != 'main'
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
      && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: CDP client regression
        working-directory: clients/gui-app
        run: bun scripts/cdp-client-browser.mjs

  # The required check. A team PR into `main` skips it with every other job, and
  # a skipped job satisfies a required check. `always()` makes it report even
  # when the suite was skipped or a job before it failed. It passes when the
  # suite ran and every job passed, or when `changes` found nothing to run;
  # anything else - a failed or cancelled shard, a failed `changes` - fails it.
  result:
    name: browser regressions
    needs: [changes, browser, cdp-client]
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      always() && (
        github.event_name != 'pull_request'
        || github.base_ref != 'main'
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          BROWSER: ${{ needs.browser.result }}
          CDP_CLIENT: ${{ needs.cdp-client.result }}
        run: |
          echo "changes=$CHANGES run=$RUN browser=$BROWSER cdp-client=$CDP_CLIENT"
          if [ "$CHANGES" != "success" ]; then
            echo "The changes job did not succeed, so nothing proves the suite could be skipped."
            exit 1
          fi
          if [ "$RUN" = "true" ]; then
            if [ "$BROWSER" != "success" ] || [ "$CDP_CLIENT" != "success" ]; then
              echo "The browser suite ran and did not pass."
              exit 1
            fi
            echo "The browser suite ran and passed."
          else
            echo "Nothing the browser suite depends on changed; it was skipped."
          fi
