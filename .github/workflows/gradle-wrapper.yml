name: Gradle wrapper

# Checks every committed gradle-wrapper.jar against the checksums Gradle
# publishes, so a tampered wrapper (it runs on every `./gradlew`) fails CI.
#
# EVERY PUSH TO `main` STILL STARTS A RUN OF THIS WORKFLOW, and it still
# concludes `success`: the Scorecard Binary-Artifacts check exempts the jar only
# while the latest commit has a successful run of this workflow, and a `paths:`
# filter on the trigger would start no run at all. What narrows is the
# `validate` job, which the `changes` job below skips when the push touches no
# wrapper file. The run, its conclusion and its head commit are unchanged.

on:
  pull_request:
  push:
    branches: [main]
  # A manual trigger, so the validation can be run deliberately on a branch now
  # that a push can skip it (AGENTS.md, "When CI runs").
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether a wrapper file changed. `scripts/ci-push-scope.sh` holds the
  # list and the four rules that keep the decision a gate; the range starts at
  # the last push this workflow PASSED on, so a red merge is not forgotten by
  # the next one.
  changes:
    name: Validate gradle-wrapper.jar (changes)
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `actions: read` lets the push step below list this workflow's earlier runs.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # Every commit, for the range below, but no file contents: the diff reads
      # trees only, and the job's two files are both in `scripts/`.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
          persist-credentials: false
      - name: Find the last green push to compare against
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(scripts/ci-last-green-sha.sh gradle-wrapper.yml "$BRANCH" "$BEFORE")"
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      - name: Did a Gradle wrapper file change?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          run="$(scripts/ci-push-scope.sh gradle-wrapper.yml "$EVENT" "$PR_BASE" "$PUSH_BASE")"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate gradle-wrapper.jar
    needs: changes
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    #
    # `!cancelled()` is what lets this job run when `changes` did not succeed:
    # without it GitHub skips a job whose dependency failed, and a tampered jar
    # would go unvalidated on a failed read. A failed detection validates, and so
    # does an answer that is anything but an explicit `false`.
    if: >-
      (
        github.event_name != 'pull_request'
        || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
      && !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.run != 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
