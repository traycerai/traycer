name: Secret scan

# Continuous secret scanning on every PR and push — catches accidental commits
# of credentials before they reach a release. We invoke the gitleaks CLI (MIT,
# free for everyone) directly instead of gitleaks-action@v2, which requires a
# paid license for GitHub organizations. Known-safe false positives (public test
# fixtures) are allowlisted in .gitleaks.toml at the repo root.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref != 'main'
      || github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --verbose
