name: Bootstrap Rolaand Traycer Local

on:
  push:
    branches:
      - rolaand/accountless-optimized
    paths:
      - '.github/rolaand-local/bootstrap-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      HOST_VERSION: 1.1.9
      HOST_SHA256: ac7d0e47d8fe27f966b670d5867aa733705748037a1ea07132cf1ea46bb4d68d

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rolaand/accountless-optimized
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb xauth zip unzip zstd strace

      - name: Apply, commit, validate, and package
        run: bash .github/rolaand-local/bootstrap-build.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rolaand-traycer-local-diagnostics
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AppImage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rolaand-traycer-local-appimage
          path: artifacts/app/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload complete source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rolaand-traycer-local-source
          path: artifacts/source/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload validation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rolaand-traycer-local-validation
          path: artifacts/report/*
          if-no-files-found: error
          retention-days: 7
