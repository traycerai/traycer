name: pre-commit

# The static-analysis gate: hygiene hooks + project checks (build / compile /
# lint / format) via .pre-commit-config.yaml's workspace-checks hook. Tests run
# separately (test.yml) so they start in parallel. No secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [static, compile, build]
    env:
      # Drive `nx affected` in the workspace-checks hook off the PR base.
      NX_BASE: ${{ github.event.pull_request.base.sha }}
      NX_HEAD: ${{ github.event.pull_request.head.sha }}
      # gui-app's type-aware lint has outgrown Node's ~4GB default heap (OOM
      # SIGABRT on two consecutive CI heads, then locally). The headroom lives
      # in that package's own `lint` script - the one place every invocation
      # (this hook, the local hook, a bare `bun run lint`) inherits it - so no
      # per-runner env is set here.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # nx affected needs history to diff against the base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.lane == 'static'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ matrix.lane }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nx-
      - name: Cache GUI ESLint fallback
        if: matrix.lane == 'static'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: clients/gui-app/.eslintcache
          key: ${{ runner.os }}-eslint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        if: matrix.lane == 'static'
        env:
          WORKSPACE_CHECK_LANE: static

      - name: Run ${{ matrix.lane }} checks
        if: matrix.lane != 'static'
        env:
          CI: "true"
          WORKSPACE_CHECK_LANE: ${{ matrix.lane }}
        run: scripts/pre_commit_workspace_checks.sh

  pre-commit:
    name: pre-commit
    if: always()
    needs: workspace-checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every workspace lane
        env:
          RESULT: ${{ needs.workspace-checks.result }}
        run: test "$RESULT" = success
