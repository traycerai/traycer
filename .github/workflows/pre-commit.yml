name: pre-commit

# The static-analysis gate: the hygiene hooks of .pre-commit-config.yaml, then
# lint, format, compile and build as their own jobs. Tests run separately
# (test.yml) so they start in parallel. No secrets.

on:
  pull_request:
  push:
    branches: [main]
  # A manual trigger for a sparing branch run, when a check is actually
  # needed before the merge (AGENTS.md, "When CI runs").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a pull request's runs supersede each other. A push to `main` gets its own
  # group (the run id): every merge is tested once, so a later merge must never
  # cancel an earlier merge's run.
  group: pre-commit-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The hygiene hooks read the whole tree on every run, so they need no history,
  # no dependencies and no Nx. `workspace-checks` is skipped here because its
  # checks are their own jobs below.
  static:
    name: static
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - name: Require temporary crash telemetry cleanup before main promotion
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/release-train-promotion-guard.cjs
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: workspace-checks

  # `oxfmt --check .` and the git output buffer guard read the whole tree on
  # every run: no history and no Nx. Nx keys the guard's project, `scripts`,
  # on its own files, so under Nx it would replay a cached pass over a new git
  # call elsewhere.
  format:
    name: format
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Check that git calls name the shared output buffer
        run: >-
          bun x vitest run --config scripts/vitest.config.ts
          scripts/__tests__/git-output-max-buffer.test.mjs
          --maxWorkers=1
      - name: Check that early-exit readers never read through a pipe under pipefail
        run: >-
          bun x vitest run --config scripts/vitest.config.ts
          scripts/__tests__/early-exit-reader-pipelines.test.mjs
          --maxWorkers=1

  workspace-checks:
    name: ${{ matrix.lane }}
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # What each lane carries from the last green push. `build` keeps the
        # renderer's compiled modules, not Nx's record of the build: that record
        # holds the whole 285 MB `dist` of every build, and a desktop build that
        # finds its modules compiled takes about 28 s anyway.
        include:
          - lane: lint
            cache: |
              .nx/cache
              .nx/workspace-data/*.db
              clients/gui-app/.eslintcache
          - lane: compile
            cache: |
              .nx/cache
              .nx/workspace-data/*.db
          - lane: build
            cache: .nx/react-compiler-cache
    # `actions: read` lets the push step below list this workflow's earlier runs.
    permissions:
      contents: read
      actions: read
    env:
      # Drive `nx affected` in the workspace-checks script off the PR base. On a
      # push to `main` the base is set by the "Find the last green push" step
      # below, not here: without a base the script falls back to `origin/main`,
      # which IS the pushed commit, so nothing would be affected and the merge
      # run would check nothing. A manual run has no base (the script needs
      # both), so it takes the fallback: the branch against `origin/main`.
      NX_BASE: ${{ github.event.pull_request.base.sha }}
      NX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Without this Nx keeps its cache and the database that indexes it in
      # `~/.nx/<workspace id>`, so the `.nx/cache` this job restores and saves
      # stays empty. Setting it keeps both inside the checkout. Nx ignores cache
      # files its database does not list, and the database file is named for the
      # machine id, which every runner of one image shares: a new image costs one
      # cold run.
      NX_CACHE_DIRECTORY: .nx/cache
      # gui-app's type-aware lint has outgrown Node's ~4GB default heap (OOM
      # SIGABRT on two consecutive CI heads, then locally). The headroom lives
      # in that package's own `lint` script - the one place every invocation
      # (this job, the local hook, a bare `bun run lint`) inherits it - so no
      # per-runner env is set here.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # nx affected needs history to diff against the base
      # A push run is compared with the last push this workflow PASSED on, not
      # with the push before it. A team PR is not tested before it merges, so a
      # red merge would otherwise be forgotten by the next one: A breaks the
      # compile, B changes a doc, B's range is only the doc, and the green run
      # on B makes the tip look shippable. From the last green push, B's range
      # still holds A's change and stays red. `$GITHUB_ENV` is the only way to
      # hand a step's answer to the job's own `NX_BASE`.
      - name: Find the last green push to compare against
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="$(scripts/ci-last-green-sha.sh pre-commit.yml "$BRANCH" "$BEFORE")"
          # No base (the lookup failed, nothing green yet, or a `before` that is
          # not in this history): `nx affected` needs a commit, and the one that
          # makes every project affected is the repository's first.
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "NX_BASE=${base}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      # Keyed on what the cached results depend on outside the files they name:
      # dependency versions for every lane, and for lint alone the rule code,
      # the runner, and the files gui-app's design-system rules read
      # (`components.json` and the stylesheets), which ESLint's cache does not
      # hash. Those files leave the other lanes' entries valid, so they are not
      # in the other lanes' keys.
      - name: Restore the Nx cache
        id: nx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.cache }}
          key: ${{ runner.os }}-nx-${{ matrix.lane }}-${{ matrix.lane == 'lint' && hashFiles('bun.lock', 'eslint/**', 'clients/gui-app/eslint.config.mjs', 'clients/gui-app/components.json', 'clients/gui-app/scripts/lint-files.mjs', 'clients/gui-app/src/**/*.css') || hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ matrix.lane }}-${{ matrix.lane == 'lint' && hashFiles('bun.lock', 'eslint/**', 'clients/gui-app/eslint.config.mjs', 'clients/gui-app/components.json', 'clients/gui-app/scripts/lint-files.mjs', 'clients/gui-app/src/**/*.css') || hashFiles('bun.lock') }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ${{ matrix.lane }} checks
        env:
          CI: "true"
          WORKSPACE_CHECK_LANE: ${{ matrix.lane }}
          TRAYCER_REACT_COMPILER_CACHE_DIR: ${{ matrix.lane == 'build' && format('{0}/.nx/react-compiler-cache', github.workspace) || '' }}
        run: |
          touch "$RUNNER_TEMP/build-start"
          scripts/pre_commit_workspace_checks.sh
      # The build prunes the compiled modules it did not use, so the cache holds
      # one build's worth. A run that built no renderer used none and keeps all.
      - name: Keep only the compiled modules this build used
        if: matrix.lane == 'build' && github.event_name == 'push'
        run: |
          cache=.nx/react-compiler-cache
          if [ -n "$(find "$cache" -type f -newer "$RUNNER_TEMP/build-start" -print -quit 2>/dev/null)" ]; then
            find "$cache" -type f ! -newer "$RUNNER_TEMP/build-start" -delete
          fi
      # Only a push saves, so a pull request's run starts from the last `main`
      # entry and adds nothing to the repository's cache quota. Only a job that
      # passed saves: when `--fix` repairs a violation Nx records the lint task as
      # passed and the job fails on the dirty tree, and that record, restored by
      # the re-run of the failed job, would turn the commit green.
      - name: Save the Nx cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.cache }}
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

  pre-commit:
    name: pre-commit
    needs: [static, format, workspace-checks]
    # A team PR into `main`, `integration/*` or `land/*` skips this job: the
    # merge to `main` runs it once. A fork PR, a bot PR and a PR into any
    # other branch run it in full.
    if: >-
      always() && (
        github.event_name != 'pull_request'
        || (github.base_ref != 'main' && !startsWith(github.base_ref, 'integration/') && !startsWith(github.base_ref, 'land/'))
        || github.event.pull_request.head.repo.full_name != github.repository
        || github.event.pull_request.user.type == 'Bot'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
