name: pre-commit

# The static-analysis gate: hygiene hooks + project checks (build / compile /
# lint / format) via .pre-commit-config.yaml's workspace-checks hook. Tests run
# separately (test.yml) so they start in parallel. No secrets.

on:
  pull_request:
  push:
    branches: [main]
  # Check a branch before merging it: the Actions tab, or
  # `gh workflow run pre-commit.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a pull request's runs supersede each other. A push to `main` gets its own
  # group (the run id): every merge is tested once, so a later merge must never
  # cancel an earlier merge's run.
  group: pre-commit-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    name: ${{ matrix.lane }}
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref != 'main'
      || github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [static, compile, build]
    env:
      # Drive `nx affected` in the workspace-checks hook off the PR base, or on a
      # push to `main` off the commit before the push: without it the hook falls
      # back to `origin/main`, which IS the pushed commit, so nothing would be
      # affected and the merge run would check nothing. A manual run has neither
      # (both are empty) and takes the fallback: the branch against `origin/main`.
      NX_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      NX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # gui-app's type-aware lint has outgrown Node's ~4GB default heap (OOM
      # SIGABRT on two consecutive CI heads, then locally). The headroom lives
      # in that package's own `lint` script - the one place every invocation
      # (this hook, the local hook, a bare `bun run lint`) inherits it - so no
      # per-runner env is set here.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # nx affected needs history to diff against the base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.lane == 'static'
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24.20.0"
      - name: Require temporary crash telemetry cleanup before main promotion
        if: matrix.lane == 'static' && github.event_name == 'pull_request'
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/release-train-promotion-guard.cjs
      - name: Cache Nx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ matrix.lane }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nx-
      - name: Cache GUI ESLint fallback
        if: matrix.lane == 'static'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: clients/gui-app/.eslintcache
          key: ${{ runner.os }}-eslint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        if: matrix.lane == 'static'
        env:
          WORKSPACE_CHECK_LANE: static

      - name: Run ${{ matrix.lane }} checks
        if: matrix.lane != 'static'
        env:
          CI: "true"
          WORKSPACE_CHECK_LANE: ${{ matrix.lane }}
        run: scripts/pre_commit_workspace_checks.sh

  pre-commit:
    name: pre-commit
    needs: workspace-checks
    # A team PR into `main` runs no CI: the merge to `main` runs it once. A fork
    # PR, a bot PR and a PR into any other branch run it in full.
    if: >-
      always() && (
        github.event_name != 'pull_request'
        || github.base_ref != 'main'
        || github.event.pull_request.head.repo.fork
        || github.event.pull_request.user.type == 'Bot'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require every workspace lane
        env:
          RESULT: ${{ needs.workspace-checks.result }}
        run: test "$RESULT" = success
