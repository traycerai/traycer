name: Publish Docs

# Publishes the public docs site (mintlify/, served at docs.traycer.ai).
# Mintlify deploys the `mintlify` branch, reading docs.json from mintlify/.
# This workflow checks links, then publishes the dispatched ref's mintlify/
# tree there as a docs-only commit.

on:
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. A newer dispatch waits for the running one instead of
# racing it to the force-push, and replaces any older run still pending, so
# the last dispatch is the last to publish.
concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Run mintlify lint checks
        working-directory: ./mintlify
        run: |
          bunx mint@4.2.939 broken-links

      - name: Setup Git
        run: |
          git config --global user.name "Traycer Ops"
          git config --global user.email devops@traycer.ai

      # The concurrency group stops two runs pushing at once, but runs can
      # enter it out of dispatch order. Run numbers follow dispatch order, so a
      # run stands down when a later dispatch is still queued or running, or
      # has already published. Re-dispatching an older ref is still how a
      # rollback is published: that dispatch is the newest run.
      - name: Check for a newer dispatch
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-docs.yml/runs?event=workflow_dispatch&per_page=50" \
            --jq "[.workflow_runs[] | select(.run_number > ${GITHUB_RUN_NUMBER}) | select(.status != \"completed\" or .conclusion == \"success\")] | length")"
          if [ "${newer}" -gt 0 ]; then
            echo "::notice::A newer Publish Docs dispatch exists, so this run does not publish."
            echo "stale=true" >> "${GITHUB_OUTPUT}"
          fi

      # The branch holds only mintlify/, never the rest of the repo. GITHUB_TOKEN
      # cannot push commits that change .github/workflows/, and a docs-only tree
      # never does. Each publish is a new commit on top of the current tip, so
      # the push is a fast-forward and fails if another run published first.
      - name: Publish Docs
        if: steps.freshness.outputs.stale != 'true'
        run: |
          tree="$(printf '040000 tree %s\tmintlify\n' "$(git rev-parse HEAD:mintlify)" | git mktree)"
          parent=()
          if git fetch --quiet origin mintlify; then
            parent=(-p FETCH_HEAD)
          fi
          commit="$(git commit-tree "${tree}" "${parent[@]}" -m "Publish docs from ${GITHUB_SHA}")"
          git push origin "${commit}:refs/heads/mintlify"
