name: Publish Docs

# Publishes the public docs site (mintlify/, served at docs.traycer.ai).
# Mintlify deploys the `mintlify` branch, reading docs.json from mintlify/.
# This workflow checks links, then force-pushes the dispatched ref there.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Run mintlify lint checks
        working-directory: ./mintlify
        run: |
          bunx mint broken-links

      - name: Setup Git
        run: |
          git config --global user.name "Traycer Ops"
          git config --global user.email devops@traycer.ai

      - name: Publish Docs
        run: |
          git checkout -B mintlify
          git push -f origin mintlify
