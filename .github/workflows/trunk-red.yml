name: Trunk red

# A team PR into `main` runs no CI (see the `if:` on every job in the workflows
# below); the full suite runs once, on the merged commit. That moves the first
# sight of a break from the pull request to `main`, so a red merge run has to
# be noticed by something other than whoever happens to look.
#
# When a push run on `main` fails, its failed jobs are re-run once, and only a
# second failure is posted to Slack with the workflow, the commit, its author
# and the run. The test suites have known flakes, and one retry separates a
# flake from a break without a person: a flake passes the retry, a break fails
# it again.
#
# The job WAITS FOR ITS OWN RETRY instead of reacting to the retry's
# completion. The retry is started with this job's token, and GitHub starts no
# workflow run from an event that token caused, so a second `workflow_run` for
# attempt two is not something to build on. Attempts after the first are
# ignored here (the `if:` below), and the job that started the retry polls it
# to the end. A cancelled run is ignored: a person cancelled it.
#
# Only push runs count. A pull-request run is its author's to read, a schedule
# run (CodeQL's weekly scan) has no commit to blame, and a manual run is
# somebody's experiment.
#
# `workflows:` must list the `name:` of every workflow that runs on a push to
# `main`; a workflow missing here can go red on `main` unseen. `DCO` is absent
# on purpose: it has no push trigger, because it checks a pull request's own
# commits. `scripts/__tests__/ci-pull-request-gate.test.mjs` fails when this
# list and the workflows' push triggers disagree.
#
# Needs the repository secret TRUNK_RED_SLACK_WEBHOOK (a Slack incoming
# webhook). With it missing the post FAILS rather than skipping, so a red run
# of this workflow is the signal that the alert has nowhere to go.
#
# No checkout and no third-party action: `gh` and `jq` are on the runner, and
# nothing here runs repository code with a write token.

on:
  workflow_run:
    workflows:
      - Tests
      - pre-commit
      - Protocol Compatibility
      - Browser regressions
      - Real supervisor (macOS launchd integration)
      - CodeQL
      - Secret scan
      - Scorecard supply-chain security
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  retry-or-report:
    name: Retry once, then report
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.run_attempt == 1
      && (
        github.event.workflow_run.conclusion == 'failure'
        || github.event.workflow_run.conclusion == 'timed_out'
      )
    runs-on: ubuntu-latest
    # The longest retried leg is the macOS packaging job; the poll below gives
    # up, and posts, before this does.
    timeout-minutes: 60
    permissions:
      # `gh run rerun` is a write on the Actions API; nothing else is needed.
      actions: write
    steps:
      - name: Retry the failed jobs once, and post if the run is still red
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK: ${{ secrets.TRUNK_RED_SLACK_WEBHOOK }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
        shell: bash
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:12}"
          # The first line of the commit message: the pull request's title on a
          # squash merge.
          title="${COMMIT_MESSAGE%%$'\n'*}"

          # $1 says what happened to the run. The title and the author are text
          # somebody else wrote: they reach the payload only as jq arguments,
          # and Slack's markup is neutralised (`<` opens a link or a mention),
          # so neither can forge a link or ping a channel.
          post() {
            printf '%s is red: %s %s on %s "%s" by %s: %s\n' \
              "${BRANCH}" "${WORKFLOW_NAME}" "$1" "${short}" "${title}" "${COMMIT_AUTHOR}" "${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "${SLACK_WEBHOOK}" ]; then
              echo "::error::TRUNK_RED_SLACK_WEBHOOK is not set, so nobody was told that ${BRANCH} is red. Add the secret."
              exit 1
            fi
            jq -n \
              --arg branch "${BRANCH}" --arg workflow "${WORKFLOW_NAME}" --arg what "$1" \
              --arg sha "${short}" --arg title "${title}" --arg author "${COMMIT_AUTHOR}" --arg url "${RUN_URL}" \
              'def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
               {text: ":red_circle: \($branch | esc) is red: *\($workflow | esc)* \($what) on \($sha) \"\($title | esc)\" by \($author | esc) <\($url)|run>"}' \
              | curl --fail --silent --show-error --retry 3 --max-time 30 \
                  -X POST -H 'Content-Type: application/json' --data-binary @- "${SLACK_WEBHOOK}" >/dev/null
          }

          # The API can refuse a re-run for a few seconds after a run completes.
          rerun_started=false
          for try in 1 2 3; do
            if gh run rerun "${RUN_ID}" --failed --repo "${GITHUB_REPOSITORY}"; then
              rerun_started=true
              break
            fi
            echo "Re-run request ${try} was refused; waiting before the next."
            sleep 15
          done
          if [ "${rerun_started}" != "true" ]; then
            # Refused because a person already re-ran it: theirs is the retry,
            # so wait for that one instead of calling the run unretryable.
            attempt_now="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.run_attempt')" || attempt_now=1
            if [ "${attempt_now:-1}" -lt 2 ]; then
              post "failed and could not be retried"
              exit 0
            fi
          fi

          # Poll the retry to its end. The run's status goes back to queued once
          # the retry is accepted, so require the attempt to have moved before
          # trusting a `completed`.
          deadline=$((SECONDS + 45 * 60))
          while :; do
            sleep 30
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.run_attempt, .status, (.conclusion // "")] | @tsv')" || state=""
            IFS=$'\t' read -r attempt status conclusion <<<"${state}"
            if [ "${attempt:-1}" -ge 2 ] && [ "${status:-}" = "completed" ]; then
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              post "failed, and its retry has not finished after 45 minutes"
              exit 0
            fi
          done

          if [ "${conclusion}" = "success" ]; then
            echo "${WORKFLOW_NAME} on ${short} passed on its retry: a flake, nothing posted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${conclusion}" = "cancelled" ]; then
            echo "The retry of ${WORKFLOW_NAME} on ${short} was cancelled by a person; nothing posted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          post "failed twice (${conclusion})"
